name: Deploy auf moosburg.eu/stadt/

# Laeuft neben dem GitHub-Pages-Workflow in pages.yml auf demselben Branch.
# Die beiden stoeren sich nicht: Pages nutzt kein FTP.
#
# Unterschiedliche base-Pfade, deshalb ein eigener Build-Befehl: Pages liegt
# unter /moosburg/ (Repo-Name), Hostinger unter /stadt/. Die Config anzufassen
# wuerde immer eine der beiden Varianten brechen.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stadt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # generate-sitemap.mjs liest lastmod aus dem letzten Commit je
          # Seiten-Datei. Mit dem flachen Standard-Checkout traegt jede Seite
          # dasselbe Datum.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:hostinger
        env:
          SITE_URL: https://moosburg.eu/stadt

      # Das Repo nutzt BrowserRouter, also echte Pfade. Ohne diese Regel
      # liefert der Server bei /stadt/rathaus/notfall einen 404, weil die
      # Datei nicht existiert. Der 404.html-Trick im Repo loest das nur fuer
      # GitHub Pages; auf Apache/LiteSpeed macht es ein Rewrite.
      # Bewusst hier erzeugt statt in public/: der Pfad /stadt/ ist eine
      # Eigenheit dieses Hosts, das Repo bleibt davon frei.
      - name: SPA-Fallback fuer Apache erzeugen
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /stadt/
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          # Anfragen mit Dateiendung nicht umschreiben. Sonst beantwortet der
          # Server eine fehlende .webp mit der SPA-Shell und HTTP 200 — ein
          # fehlendes Bild saehe dann aus, als gaebe es die Datei.
          RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{2,5}$
          RewriteRule . /stadt/index.html [L]
          HTACCESS
          cat dist/.htaccess

      # Eigenes FTP-Konto, in hPanel auf den Ordner stadt beschränkt: Das
      # Login beginnt dort, deshalb unten server-dir ./. Gehören die Secrets zu
      # einem anderen Konto oder liegt das Login in der Domain-Wurzel, bricht
      # der Deploy hier ab, bevor etwas übertragen wird (moosburg-eu/BRIEFING.md).
      - name: Ziel prüfen
        env:
          KONTO: stadt
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          case "$FTP_USER" in
            *"$KONTO") ;;
            *) echo "FTP_USER ist nicht das Konto $KONTO. Abbruch."; exit 1 ;;
          esac
          liste=$(curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" --list-only "ftp://$FTP_HOST/" | tr -d '\r')
          if grep -qx stadtrat <<< "$liste" && grep -qx abstimmung <<< "$liste"; then
            echo "Das Login liegt in der Domain-Wurzel. Abbruch."; exit 1
          fi

      - name: Nach stadt/ spiegeln
        # v4.4.0, auf den Commit gepinnt: Ein verschobener Tag soll nicht
        # unbemerkt anderen Code an das FTP-Passwort bringen.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Prüft das Zertifikat. FTP_HOST ist deshalb srv1973.hstgr.io: Das
          # Zertifikat lautet auf *.hstgr.io, ftp.moosburg.eu passt nicht dazu.
          security: strict
          local-dir: ./dist/
          server-dir: ./

          # Kurz nach einer anderen Uebertragung nimmt Hostinger die Verbindung
          # verzoegert an; die 30 s Standard-Timeout reichen dann nicht.
          timeout: 120000
